<<!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="description"
          content="Contact White Water Rafting for reservations, questions, and information about our exciting rafting adventures.">

        <meta name="author" content="Ephraim Otikor">

        <title>Contact Us | White Water Rafting</title>

        <link rel="stylesheet" href="styles/rafting.css">
    </head>

    <body>

        <header>
            <img src="images/logo.jpg" alt="White Water Rafting Logo" width="120">

            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </header>

        <main>

            <section class="contact-intro">

                <h1>White Water Rafting Company</h1>

                <p>
                    <strong>123 Main River Street</strong><br>
                    Kolob, California<br>
                    <strong>+1 999 999 9999</strong><br>
                    <strong>info@whitewater.com</strong>
                </p>

            </section>

            <section class="contact-details">

                <div class="map">
                    <iframe src="https://www.google.com/maps?q=Kolob,California&output=embed"
                      width="100%" height="250"
                      title="Map showing the location of White Water Rafting Company">
                    </iframe>
                </div>

                <form>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email"
                          required>
                    </div>

                    <fieldset>

                        <legend>Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general-inquiry">
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation-question">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="website-suggestion">
                            Website Suggestion
                        </label>

                    </fieldset>

                    <div class="form-group message-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message"
                          placeholder="Type your message here..." required></textarea>
                    </div>

                    <label class="newsletter">
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </section>

            <section class="employees">

                <h2>We Are Here to Serve You</h2>

                <figure>
                    <img src="images/employee1.jpg" alt="Rafting guide">
                    <figcaption>River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Adventure coordinator">
                    <figcaption>Adventure Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer service manager">
                    <figcaption>Customer Service Manager</figcaption>
                </figure>

            </section>

        </main>

        <footer>

            <p>&copy; 2026 White Water Rafting | Ephraim Otikor</p>

            <nav class="socialmedia">

                <a href="https://facebook.com">
                    <img src="images/facebook.jpg" alt="Facebook">
                </a>

                <a href="https://instagram.com">
                    <img src="images/instagram.jpg" alt="Instagram">
                </a>

                <a href="https://twitter.com">
                    <img src="images/twitter.jpg" alt="Twitter">
                </a>

            </nav>

        </footer>

    </body>

    </html>
